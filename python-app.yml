name: Kalshi Bot Safety Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run paper worker safety tests
        run: python -m unittest -v test_paper_worker.py

      - name: Run trend stop tests
        run: python -m unittest -v test_trend_stop.py

      - name: Run trend fusion gate tests
        run: python -m unittest -v test_signal_fusion_trend_gate

      - name: Run BTC trend monitor tests
        run: python -m unittest -v test_btc_trend_monitor.py

      - name: Run signal engine tests
        run: python -m unittest -v test_signal_engine.py

      - name: Run Kalshi API retry tests
        run: python -m unittest -v test_kalshi_api.py

      - name: Run order-book quote tests
        run: python -m unittest -v test_orderbook_quote_pricing.py

      - name: Run entry-quality tests
        run: python -m unittest -v test_entry_quality.py

      - name: Run current-signal freshness tests
        run: python -m unittest -v test_current_signal.py

      - name: Run current-window fallback tests
        run: python -m unittest -v test_current_window_wait.py

      - name: Run wait-alert tests
        run: python -m unittest -v test_wait_alerts.py

      - name: Run market-data diagnostics tests
        run: python -m unittest -v test_market_data_diagnostics.py

      - name: Run trend-monitor worker tests
        run: python -m unittest -v test_trend_monitor_worker.py

      - name: Run strategy performance audit tests
        run: python -m unittest -v test_performance_audit.py

      - name: Run decision audit schema tests
        run: python -m pytest -q test_decision_audit.py

      - name: Run performance analytics tests
        run: python -m pytest -q test_performance_analytics.py

      - name: Run analytics API integration tests
        run: python -m pytest -q test_analytics_api.py

      - name: Run rejected-signal counterfactual tests
        run: python -m pytest -q test_counterfactual_audit.py
